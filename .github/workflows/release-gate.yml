name: Release gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    concurrency:
      group: release-preview-main
      cancel-in-progress: true
    environment: release-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      CONVEX_MANAGEMENT_TOKEN: ${{ secrets.CONVEX_MANAGEMENT_TOKEN }}
      E2E_HOST_EMAIL: ${{ secrets.E2E_HOST_EMAIL }}
      E2E_HOST_PASSWORD: ${{ secrets.E2E_HOST_PASSWORD }}
      E2E_GUEST_EMAIL: ${{ secrets.E2E_GUEST_EMAIL }}
      E2E_GUEST_PASSWORD: ${{ secrets.E2E_GUEST_PASSWORD }}
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX_ID: ${{ vars.AGENTMAIL_INBOX_ID }}
      AGENTMAIL_TEST_RECIPIENT: ${{ vars.AGENTMAIL_TEST_RECIPIENT }}
      AGENTMAIL_TEST_RECIPIENT_INBOX_ID: ${{ vars.AGENTMAIL_TEST_RECIPIENT_INBOX_ID }}
      AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
      AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
      GOOGLE_CALENDAR_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_TEST_REFRESH_TOKEN }}
      GOOGLE_CALENDAR_TEST_ID: ${{ vars.GOOGLE_CALENDAR_TEST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create fresh Convex preview and seed release fixtures
        run: npx convex deploy --preview-create main --cmd "node scripts/export-preview-env.mjs" --cmd-url-env-var-name VITE_CONVEX_URL --preview-run testing:seedReleaseFixtures
      - name: Build and publish the preview frontend
        run: npx @convex-dev/static-hosting deploy --build-command "npm run build -- --mode test"
      - name: Configure preview-only test access
        run: |
          npx convex env set APP_URL "$E2E_BASE_URL"
          npx convex env set E2E_PASSWORD_AUTH_ENABLED true
          npx convex env set E2E_TEST_EMAILS "$E2E_HOST_EMAIL,$E2E_GUEST_EMAIL,guest-two@example.test"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-failures
          path: test-results
          retention-days: 7
      - name: Delete disposable Convex preview
        if: always()
        run: node scripts/delete-release-preview.mjs
